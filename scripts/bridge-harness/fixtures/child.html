<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 14px sans-serif; }
  #cbtn { position: absolute; left: 0; top: 0; width: 100px; height: 30px; }
  #cinp { position: absolute; left: 120px; top: 0; width: 150px; height: 30px; }
  #clink { position: absolute; left: 0; top: 50px; }
  #cpara { position: absolute; left: 0; top: 100px; width: 300px; height: 30px; margin: 0; cursor: help; }
</style></head>
<body>
<button id="cbtn">Child button</button>
<input id="cinp" type="text">
<a id="clink" href="https://example.com/child">child link</a>
<p id="cpara">child text that is selectable</p>
<script>
  var tag = location.search.slice(1);
  function report(s) { try { webkit.messageHandlers.harness.postMessage(tag + ': ' + s); } catch (e) {} }
  document.getElementById('cbtn').addEventListener('click', function (e) { report('click cbtn detail=' + e.detail); });
  document.getElementById('cinp').addEventListener('input', function (e) { report('input cinp=' + e.target.value); });
  document.getElementById('cinp').addEventListener('focus', function () { report('focus cinp'); });
  document.getElementById('clink').addEventListener('click', function (e) { report('click clink'); e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { report('contextmenu ' + e.target.id); });
</script>
</body></html>
